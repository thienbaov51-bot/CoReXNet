name: Update data download page
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-page.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Update download description
        run: |
          cat > notes.md <<'EOF'
          Preprocessed data for Electricity, PEMS03, PEMS04, PEMS08, Solar and AEMO5.

          Includes standardized arrays, training normalization statistics, chronological splits and forecast indices for L=96 and H=96/192/336/720.

          Download the ZIP below or run `python download_data.py` from the repository. [Data format](https://github.com/thienbaov51-bot/CoReXNet/blob/main/data/README.md).
          EOF
          gh release edit data-v1.0.0 --title 'CoReXNet preprocessed data' --notes-file notes.md
      - name: Keep data and checksum downloads
        run: |
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GH_REPO']
          assets={795716167:'COMPLETE_PROCESSED_DATA_MANIFEST.json',795716168:'DATA_BUILD_RECEIPT.json'}
          for asset_id,name in assets.items():
              url=f'repos/{repo}/releases/assets/{asset_id}'
              metadata=json.loads(subprocess.check_output(['gh','api',url],text=True))
              assert metadata['name']==name
              subprocess.run(['gh','api','--method','DELETE',url],check=True)
          PY
