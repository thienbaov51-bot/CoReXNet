name: Verify code and release prepared data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reproducibility.yml'
      - 'scripts/**'
      - 'original_core/**'
      - 'smoke_test.py'
      - 'validate_data.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU verification dependencies
        run: |
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check original scientific source identities
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.loads(Path('SCIENTIFIC_SOURCE_MANIFEST.json').read_text())
          for row in m['files']:
              p=Path(row['path'])
              assert p.stat().st_size==row['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256'],str(p)
              compile(p.read_text(),str(p),'exec')
          print('Verified all seven byte-preserved scientific sources')
          PY
      - name: Run CPU forward, backward and data-boundary checks
        run: python -B smoke_test.py

  prepared-data:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed data-build dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3
      - name: Recover and verify the six fixed scientific inputs
        run: |
          python -B scripts/rebuild_public_data.py --output-dir build/data
          cp build/data/processed/DATA_MANIFEST.json build/data/COMPLETE_PROCESSED_DATA_MANIFEST.json
      - name: Validate prepared arrays and all 72 origin vectors
        run: |
          python -B download_data.py --archive build/data/CoReXNet_preprocessed_data_v1.zip --output build/loader-check
          for dataset in Electricity PEMS03 PEMS04 PEMS08 Solar AEMO5; do
            python -B run.py --dataset "$dataset" --check-data --data-root build/loader-check
          done
      - uses: actions/upload-artifact@v4
        with:
          name: verified-preprocessed-datasets
          path: |
            build/data/CoReXNet_preprocessed_data_v1.zip
            build/data/CoReXNet_preprocessed_data_v1.zip.sha256
            build/data/COMPLETE_PROCESSED_DATA_MANIFEST.json
            build/data/DATA_BUILD_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

  publish-data:
    runs-on: ubuntu-22.04
    needs: [smoke, prepared-data]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-preprocessed-datasets
          path: release-assets
      - name: Publish immutable prepared-data release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view data-v1.0.0 >/dev/null 2>&1; then
            echo 'The prepared-data release already exists. Publish a new tag for changed data.'
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          Prepared inputs for all six CoReXNet benchmarks in one download.

          The archive contains the multivariate float32 arrays, chronological split boundaries, TRAIN-only normalization statistics, standardized inputs, and forecast-origin vectors for L=96 and H=96/192/336/720. Dataset and preprocessing identities are pinned to the original experiment records. Code CPU forward/backward checks and all prepared-data boundary checks passed before publication.

          Download the ZIP below, or run `python download_data.py` from the repository. No manual splitting or normalization is required.
          EOF
          find release-assets -maxdepth 3 -type f
          gh release create data-v1.0.0 release-assets/CoReXNet_preprocessed_data_v1.zip release-assets/CoReXNet_preprocessed_data_v1.zip.sha256 release-assets/COMPLETE_PROCESSED_DATA_MANIFEST.json release-assets/DATA_BUILD_RECEIPT.json --target "$RELEASE_COMMIT" --title 'CoReXNet prepared benchmark data v1.0.0' --notes-file release-notes.md
